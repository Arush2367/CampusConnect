services:
  - type: web
    name: campusconnect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: CAMPUSCONNECT_ENV
        value: production
      - key: CAMPUSCONNECT_HOST
        value: 0.0.0.0
      - key: CAMPUSCONNECT_DATA_DIR
        value: /var/data
      - key: CAMPUSCONNECT_HTTPS
        value: "1"
      - key: CAMPUSCONNECT_SEED_DEMO
        value: "0"
      # NOTE: Render Free web services cannot make outbound SMTP connections
      # on ports 25/465/587. Keep these unset until an HTTPS email provider
      # (or a paid web service) is configured.
      - key: CAMPUSCONNECT_EMAIL_MODE
        value: smtp
      - key: CAMPUSCONNECT_SMTP_HOST
        sync: false
      - key: CAMPUSCONNECT_SMTP_PORT
        sync: false
      - key: CAMPUSCONNECT_SMTP_USERNAME
        sync: false
      - key: CAMPUSCONNECT_SMTP_APP_PASSWORD
        sync: false
      - key: CAMPUSCONNECT_SMTP_FROM_NAME
        value: Campus Connect
      - key: CAMPUSCONNECT_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-db
          property: connectionString
      - key: CAMPUSCONNECT_PRIMARY_ADMIN
        value: ADMIN001
      - key: CAMPUSCONNECT_BOOTSTRAP_ADMIN_NAME
        value: Campus Connect Admin
      - key: CAMPUSCONNECT_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: CAMPUSCONNECT_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CAMPUSCONNECT_BOOTSTRAP_ADMIN_MOBILE
        sync: false

# Free Postgres is suitable for demos/testing only and expires after 30 days.
databases:
  - name: campusconnect-db
    databaseName: campusconnect
    user: campusconnect
    plan: free

